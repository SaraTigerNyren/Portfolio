<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projekt | Sara Tiger Nyrén</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#f7f3ee;--white:#fffdfb;--brown:#795b45;--dark:#2c2621;--muted:#6e655e}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font:16px/1.75 'DM Sans',Arial,sans-serif}a{color:var(--brown)}.wrap{max-width:1040px;margin:auto;padding:0 26px}header{background:var(--white);border-bottom:1px solid #e9e1d8}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:700;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;color:var(--dark);font-size:14px}.back{text-decoration:none;font-size:14px}.hero{padding:85px 0 70px;background:linear-gradient(115deg,#f1e9e0,#e3d3c1)}.eyebrow{text-transform:uppercase;letter-spacing:.2em;color:var(--brown);font-size:12px;font-weight:700}h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;line-height:1.2}h1{font-size:clamp(38px,5vw,66px);max-width:800px;margin:16px 0 20px}h2{font-size:clamp(29px,3vw,40px);margin:0 0 20px}.lead{font-size:18px;max-width:750px}.content{padding:65px 0}.section{padding:44px 0;border-bottom:1px solid #ddd1c4}.section p{white-space:pre-line;max-width:760px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:25px}.gallery figure{margin:0;background:#ede4da;border-radius:9px;overflow:hidden}.gallery img{width:100%;height:auto;display:block}.gallery figcaption{padding:8px 14px;font-size:13px;color:var(--muted)}.cover{max-height:540px;width:100%;object-fit:cover;border-radius:9px;margin-top:26px}footer{text-align:center;padding:30px;color:var(--muted)}@media(max-width:650px){.gallery{grid-template-columns:1fr}.hero{padding:55px 0}.nav{flex-wrap:wrap;padding:15px 0}}
</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">Sara Tiger Nyrén</a><a class="back" href="index.html#projekt">← Alla projekt</a></div></header><main id="main"></main><footer>© Sara Tiger Nyrén · <a href="index.html">Till startsidan</a></footer>
<script src="projektdata.js"></script><script>
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id = new URLSearchParams(location.search).get('id');
const project = (window.PROJEKT||[]).find(p=>p.id===id);
const main=document.getElementById('main');
if(!project){main.innerHTML='<div class="wrap content"><h1>Projektet hittades inte</h1><p><a href="index.html#projekt">Tillbaka till projekten</a></p></div>'}
else{
 document.title=project.titel+' | Sara Tiger Nyrén';
 const gallery=imgs=>(imgs||[]).length?`<div class="gallery">${imgs.map(img=>{const file=typeof img==='string'?img:img.fil;const caption=typeof img==='string'?'':img.bildtext;return `<figure><img src="${encodeURI(file)}" alt="${esc(caption||project.titel)}" loading="lazy"><figcaption>${esc(caption)}</figcaption></figure>`}).join('')}</div>`:'';
 main.innerHTML=`<div class="hero"><div class="wrap"><div class="eyebrow">${esc(project.kategori)}</div><h1>${esc(project.titel)}</h1><p class="lead">${esc(project.introduktion)}</p>${project.omslagsbild?`<img class="cover" src="${encodeURI(project.omslagsbild)}" alt="${esc(project.titel)}">`:''}</div></div><div class="wrap content">${(project.avsnitt||[]).map(s=>`<section class="section"><h2>${esc(s.rubrik)}</h2><p>${esc(s.text)}</p>${gallery(s.bilder)}</section>`).join('')}<p style="margin-top:40px"><a href="index.html#projekt">← Tillbaka till alla projekt</a></p></div>`;
}
</script></body></html>
