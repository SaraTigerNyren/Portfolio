
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projekt | Sara Tiger Nyrén</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f7f3ee;
      --white: #fffdfb;
      --brown: #795b45;
      --dark: #2c2621;
      --muted: #6e655e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--dark);
      font: 16px/1.75 'DM Sans', Arial, sans-serif;
    }

    a {
      color: var(--brown);
    }

    .wrap {
      max-width: 1040px;
      margin: auto;
      padding: 0 26px;
    }

    header {
      background: var(--white);
      border-bottom: 1px solid #e9e1d8;
    }

    .nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--dark);
      font-size: 14px;
    }

    .back {
      text-decoration: none;
      font-size: 14px;
    }

    .hero {
      padding: 85px 0 70px;
      background: linear-gradient(115deg, #f1e9e0, #e3d3c1);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: .2em;
      color: var(--brown);
      font-size: 12px;
      font-weight: 700;
    }

    h1, h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 500;
      line-height: 1.2;
    }

    h1 {
      font-size: clamp(38px, 5vw, 66px);
      max-width: 800px;
      margin: 16px 0 20px;
    }

    h2 {
      font-size: clamp(29px, 3vw, 40px);
      margin: 0 0 20px;
    }

    .lead {
      font-size: 18px;
      max-width: 750px;
    }

    .content {
      padding: 65px 0;
    }

    .section {
      padding: 44px 0;
      border-bottom: 1px solid #ddd1c4;
    }

    .section p {
      white-space: pre-line;
      max-width: 760px;
    }

    /* Projekt 01–03: större bildgalleri */

    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      max-width: 850px;
      margin: 30px auto;
    }

    .gallery figure {
      margin: 0;
      background: transparent;
      border-radius: 0;
      overflow: visible;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
    }

    .gallery figcaption {
      padding: 10px 0;
      font-size: 13px;
      color: var(--muted);
    }

    .cover {
      display: block;
      width: 100%;
      max-width: 850px;
      height: auto;
      max-height: none;
      object-fit: contain;
      border-radius: 9px;
      margin: 30px auto 0;
    }

    /* Projekt 04–06: enkel layout */

    .simple-project .section {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: 45px;
      padding: 65px 0;
    }

    .simple-project .section-text {
      min-width: 0;
    }

    .simple-project .section h2 {
      margin-top: 0;
    }

    .simple-project .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin: 0;
      max-width: 100%;
    }

    .simple-project .gallery figure {
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .simple-project .gallery img {
      width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: contain;
      border: none;
      box-shadow: none;
    }

    .simple-project .gallery figcaption {
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }

    @media (max-width: 650px) {
      .hero {
        padding: 55px 0;
      }

      .nav {
        flex-wrap: wrap;
        padding: 15px 0;
      }

      .simple-project .section {
        grid-template-columns: 1fr;
        gap: 22px;
        padding: 40px 0;
      }

      .simple-project .gallery img {
        max-height: none;
      }
    }
    /* Ny, stilren design för projekt 04–06 */

.simple-project .hero {
  background: #f7f3ee;
  padding: 65px 0 25px;
}

.simple-project .hero h1 {
  font-size: clamp(34px, 4vw, 48px);
}

.simple-project .content {
  padding-top: 10px;
}

.simple-project .section {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: 55px;
  padding: 65px 0;
}

.simple-project .section h2 {
  font-size: clamp(27px, 3vw, 36px);
}

.simple-project .gallery {
  max-width: 100%;
  margin: 0;
  gap: 20px;
}

.simple-project .gallery figure {
  background: transparent;
  border: none;
  box-shadow: none;
}

.simple-project .gallery img {
  width: 100%;
  height: auto;
  max-height: 400px;
  object-fit: contain;
  border-radius: 0;
}

.simple-project .gallery figcaption {
  font-size: 12px;
  text-align: center;
}

@media (max-width: 650px) {
  .simple-project .section {
    grid-template-columns: 1fr;
    gap: 25px;
    padding: 40px 0;
  }
}
  </style>
</head>

<body>

  <header>
    <div class="wrap nav">
      <a class="brand" href="index.html">Sara Tiger Nyrén</a>
      <a class="back" href="index.html#projekt">← Alla projekt</a>
    </div>
  </header>

  <main id="main"></main>

  <footer>
    © Sara Tiger Nyrén ·
    <a href="index.html">Till startsidan</a>
  </footer>

  <script src="projektdata.js"></script>

  <script>
    const esc = v => String(v ?? '').replace(
      /[&<>"']/g,
      c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c])
    );

    const id = new URLSearchParams(location.search).get('id');

    const project = (window.PROJEKT || []).find(
      p => p.id === id
    );

    const main = document.getElementById('main');

    if (!project) {
      main.innerHTML = `
        <div class="wrap content">
          <h1>Projektet hittades inte</h1>
          <p>
            <a href="index.html#projekt">
              Tillbaka till projekten
            </a>
          </p>
        </div>
      `;
    } else {

      document.title = project.titel + ' | Sara Tiger Nyrén';

      // Identifierar projekt 04, 05 och 06 utifrån
      // projektets plats i projektdata.js.

      const projectIndex = (window.PROJEKT || []).indexOf(project);
      const isSimple = projectIndex >= 3 && projectIndex <= 5;

      const gallery = imgs => (imgs || []).length
        ? `
          <div class="gallery">
            ${imgs.map(img => {
              const file = typeof img === 'string'
                ? img
                : img.fil;

              const caption = typeof img === 'string'
                ? ''
                : img.bildtext;

              return `
                <figure>
                  <img
                    src="${encodeURI(file)}"
                    alt="${esc(caption || project.titel)}"
                    loading="lazy"
                  >
                  ${caption
                    ? `<figcaption>${esc(caption)}</figcaption>`
                    : ''}
                </figure>
              `;
            }).join('')}
          </div>
        `
        : '';

      const sections = (project.avsnitt || []).map(s => {

        if (isSimple) {
          return `
            <section class="section">
              <div class="section-text">
                <h2>${esc(s.rubrik)}</h2>
                <p>${esc(s.text)}</p>
              </div>
              ${gallery(s.bilder)}
            </section>
          `;
        }

        return `
          <section class="section">
            <h2>${esc(s.rubrik)}</h2>
            <p>${esc(s.text)}</p>
            ${gallery(s.bilder)}
          </section>
        `;

      }).join('');

      main.innerHTML = `
        <div class="${isSimple ? 'simple-project' : 'detailed-project'}">

          <div class="hero">
            <div class="wrap">
              <div class="eyebrow">
                ${esc(project.kategori)}
              </div>

              <h1>${esc(project.titel)}</h1>

              <p class="lead">
                ${esc(project.introduktion)}
              </p>

              ${project.omslagsbild
                ? `
                  <img
                    class="cover"
                    src="${encodeURI(project.omslagsbild)}"
                    alt="${esc(project.titel)}"
                  >
                `
                : ''}
            </div>
          </div>

          <div class="wrap content">
            ${sections}

            <p style="margin-top:40px">
              <a href="index.html#projekt">
                ← Tillbaka till alla projekt
              </a>
            </p>
          </div>

        </div>
      `;
    }
  </script>

</body>
</html>
